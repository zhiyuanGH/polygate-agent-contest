name: Web image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: web
      - name: Prepare image context
        run: |
          mkdir -p .release/web/site
          cp deploy/web.Dockerfile .release/web/Dockerfile
          cp deploy/nginx.conf .release/web/nginx.conf
          cp -a web/dist/. .release/web/site/
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .release/web
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/kasperxms/polygate-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Image: `ghcr.io/kasperxms/polygate-web@${{ steps.image.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
